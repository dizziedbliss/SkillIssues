name: "Bug report"
description: Something broken or behaving oddly in the website or the API.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! Every bug squashed leaves the catalog a little less cursed.

        - **Never paste tokens, client secrets, cookies or private keys** into this issue.
        - **Security problems do not belong here.** Report them [privately](https://github.com/dizziedbliss/SkillIssues/security/advisories/new).
        - Wrong data about one repository or issue has its own form (repository coverage, wrong difficulty or stale data), and so do the desktop app, themes and accessibility.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear, concise description of what went sideways.
      placeholder: "I filtered by Rust and Beginner, and the page said there were no issues, but the count above it said 214..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How do we trigger the behavior? If it only happens with certain filters or a search, include them.
      placeholder: |
        1. Open the issue catalog
        2. Set the language filter to '...'
        3. Scroll to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: logs-screenshots
    attributes:
      label: Logs, console output, or screenshots
      description: Paste relevant output or drag-and-drop screenshots. Double check that no tokens, cookies or secrets are visible.
      render: shell

  - type: dropdown
    id: area
    attributes:
      label: Area of the project
      description: Where is the bug occurring?
      options:
        - Web app (catalog, search, filters, saved issues)
        - Sign-in / account
        - Backend API (Go)
        - Ingestion engine (ingestd)
        - Live visualizer
        - Database / migrations
        - Docker Compose / self-hosting
        - Not sure
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment details
      description: Browser and version, OS. If you run it yourself, add Docker / Node / Go versions and the commit.
      placeholder: |
        - Browser: Firefox 140
        - OS: Ubuntu 24.04
    validations:
      required: true

  - type: checkboxes
    id: safety-check
    attributes:
      label: Secret-safety checklist
      options:
        - label: I checked that this issue contains no tokens, client secrets, cookies or private keys.
          required: true
        - label: This is not a security vulnerability (those go to private vulnerability reporting).
          required: true
