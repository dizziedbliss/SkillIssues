name: "📚 Documentation or website content"
description: A typo, an outdated command, or a page on the site that says something untrue?
title: "[Docs]: "
labels: ["documentation", "website", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        The written pages on the site and the docs in the repository should describe what the code does today. If one doesn't, tell us.

        Please never paste tokens or secrets. Security problems go to [private vulnerability reporting](https://github.com/dizziedbliss/SkillIssues/security/advisories/new), not issues.

  - type: input
    id: location
    attributes:
      label: Where is it?
      description: The page URL (for example https://skillissues.dizziedbliss.lol/faq) or the file path and section in the repository.
      placeholder: "https://skillissues.dizziedbliss.lol/how-it-works"
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem is it?
      options:
        - It says something that isn't true
        - It is out of date
        - It is missing or unclear
        - Typo or broken link
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What needs fixing?
      description: Quote the sentence if you can, and say what is wrong with it.
      placeholder: "The page says X, but on Windows/Linux it actually requires Y..."
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording or solution
      description: How could we phrase or structure it better?

  - type: checkboxes
    id: contribution
    attributes:
      label: Willing to open a PR?
      options:
        - label: I would love to submit a quick PR to fix this.
