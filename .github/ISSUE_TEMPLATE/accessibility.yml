name: "♿ Accessibility problem"
description: Something on the site or app that is hard or impossible to use with your setup.
title: "[A11y]: "
labels: ["accessibility", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        If something on SkillIssues is hard to use, with a keyboard, a screen reader, zoom, reduced motion, low vision or anything else, that is a bug and we want to fix it. You don't need to know the technical name for the problem.

        Please never paste tokens or secrets. Security problems go to [private vulnerability reporting](https://github.com/dizziedbliss/SkillIssues/security/advisories/new), not issues.

  - type: input
    id: where
    attributes:
      label: Where is the problem?
      description: The page URL, or the part of the app (desktop app, a theme).
      placeholder: "https://skillissues.dizziedbliss.lol/"
    validations:
      required: true

  - type: textarea
    id: barrier
    attributes:
      label: What gets in your way?
      description: What you were trying to do and what stopped you.
      placeholder: "I can't reach the language filter with the keyboard alone..."
    validations:
      required: true

  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Browser, OS, and any assistive technology (screen reader and version, magnifier, switch device, voice control), zoom level, or settings such as reduced motion or high contrast.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: What would help? (optional)
