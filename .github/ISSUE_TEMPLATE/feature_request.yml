name: "Feature request"
description: Have a concrete idea to make finding or working on an issue better?
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea that would make sorting the issue chaos smoother, faster, or more fun? Let us know!

        Not sure it is fully formed yet? Float it in [Ideas](https://github.com/dizziedbliss/SkillIssues/discussions/categories/ideas) first, and open a request here once it is concrete.

        Please never paste tokens or secrets. Security problems go to [private vulnerability reporting](https://github.com/dizziedbliss/SkillIssues/security/advisories/new), not issues.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What is currently frustrating, awkward, or missing?
      placeholder: "When I look for issues in a language I'm learning, I can't tell which ones have an active discussion..."
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Did you think of other ways to solve this, or workarounds you use today?

  - type: dropdown
    id: area
    attributes:
      label: Area of the project
      description: Which component would this feature touch?
      options:
        - Web app (catalog, search, filters)
        - Themes
        - Desktop app (Electron)
        - Backend API (Go)
        - Ingestion and sync (ingestd)
        - Website pages
        - Other
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Willing to help?
      options:
        - label: I would be interested in opening a PR or helping implement this feature.
