name: CI

# No `push` trigger: on a branch with an open PR it ran every job a second
# time next to `pull_request`, and on main a second time next to the copy
# deploy.yml runs. Run it by hand (workflow_dispatch) for a branch with no PR.
on:
  pull_request:
    branches: [ main, ship ]
  # Lets deploy.yml depend on this workflow directly (needs: ci-job-names)
  # rather than reacting via workflow_run, which runs against the default
  # branch and makes ref handling error-prone.
  workflow_call: {}
  workflow_dispatch: {}

# A new push to a PR cancels that PR's run still in progress. Every other run
# (the deploy gate on main) gets a group of its own and is never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Decides which jobs below have anything to check. A job whose paths did
  # not change is skipped, and a skipped job does not fail the run. A manual
  # dispatch checks everything.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web == 'true' }}
      desktop: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.desktop == 'true' }}
      compose: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.compose == 'true' }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name != 'workflow_dispatch'
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          # Empty token: diff with git instead of the PR-files API, which
          # would need pull-requests: read — more than deploy.yml grants
          # the workflow it calls.
          token: ''
          # ci.yml, the Dockerfile and the root npm manifests feed every job
          # that uses them, so a change there re-checks those jobs.
          filters: |
            shared: &shared
              - .github/workflows/ci.yml
              - Dockerfile
              - .dockerignore
            npm: &npm
              - *shared
              - package.json
              - package-lock.json
              - packages/**
            backend:
              - *shared
              - backend/**
            web:
              - *npm
              - web/**
            desktop:
              - *npm
              - desktop/**
            compose:
              - *shared
              - compose.yaml
              - compose.prod.yaml
              - monitoring/**
              - Caddyfile

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    # For the tests that need a real database or Redis (skipped under
    # -short and when their *_TEST_URL is unset). Same images as compose.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: skillissues
          POSTGRES_PASSWORD: skillissues
          POSTGRES_DB: skillissues
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U skillissues"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [ '6379:6379' ]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      - name: Go vet
        run: |
          cd backend
          go vet ./...
      - name: gofmt
        run: |
          cd backend
          test -z "$(gofmt -l .)" || { echo "gofmt drift in:"; gofmt -l .; exit 1; }
      - name: Go build
        run: |
          cd backend
          go build ./...
      - name: Go test (unit, no integration)
        run: |
          cd backend
          go test -short ./...
      - name: Go test (Postgres and Redis)
        # ./internal/... only: the root integration test needs a running API.
        env:
          DATABASE_URL: postgresql://skillissues:skillissues@localhost:5432/skillissues
          TEST_DATABASE_URL: postgresql://skillissues:skillissues@localhost:5432/skillissues
          REDIS_TEST_URL: redis://localhost:6379/15
        run: |
          cd backend
          go run ./cmd/migrate
          go test -count=1 ./internal/...

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install
        # web, desktop and packages/* are one npm workspace (root
        # package.json) — a single install at the root resolves
        # @skillissues/markdown, @skillissues/api-client and
        # @skillissues/ui as real node_modules symlinks. Node 22's bundled
        # npm (10.9.x) has a known bug where `npm ci` hard-fails on an
        # unrelated optionalDependency's platform mismatch instead of
        # skipping it, once enough workspace members (desktop's
        # electron-builder) pull in enough platform-specific optional
        # deps — same fix as the root Dockerfile.
        run: |
          npm install -g npm@11
          npm ci
      - name: Typecheck
        run: |
          cd web
          npm run typecheck
      - name: Build
        # The real build, not just tsc --noEmit: this is what actually
        # catches a broken packages/markdown import, since typecheck alone
        # does not exercise Vite's module resolution the same way.
        run: |
          cd web
          npm run build

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install
        # Same reason as the web job's install step above.
        run: |
          npm install -g npm@11
          npm ci
      - name: Check
        run: |
          cd desktop
          npm run check
      - name: Build
        # electron-vite build is what actually catches a renderer import
        # breaking at the bundler level (e.g. a packages/* workspace
        # resolution issue `tsc --noEmit` wouldn't surface).
        run: |
          cd desktop
          npm run build

  images:
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate Docker Compose configuration (dev + prod)
        # compose.prod.yaml requires several secrets to be set (POSTGRES_PASSWORD,
        # ADMIN_SYNC_TOKEN, ...) via `:?` — CI supplies throwaway values just
        # so `config` can resolve the file; nothing here is a real credential.
        run: |
          docker compose -f compose.yaml config --quiet
          POSTGRES_PASSWORD=ci DOMAIN=ci.example.com \
          FRONTEND_URL=https://ci.example.com \
          GITHUB_REDIRECT_URI=https://ci.example.com/api/auth/github/callback \
          GITHUB_WEBHOOK_SECRET=ci ADMIN_SYNC_TOKEN=ci \
          METRICS_DB_PASSWORD=ci GRAFANA_ADMIN_PASSWORD=ci GRAFANA_SECRET_KEY=ci \
            docker compose -f compose.prod.yaml config --quiet
      - name: Set up Docker Buildx
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true'
        uses: docker/setup-buildx-action@v4
      - name: Build api target
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build ingestd target
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ingestd
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build migrate target
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrate
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web target
        if: needs.changes.outputs.web == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=/api
