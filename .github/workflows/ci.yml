name: CI

# No `push` trigger: on a branch with an open PR it ran every job a second
# time next to `pull_request`, and on main a second time next to the copy
# deploy.yml runs. Run it by hand (workflow_dispatch) for a branch with no PR.
on:
  pull_request:
    branches: [ main, ship ]
  # Lets deploy.yml depend on this workflow directly (needs: ci-job-names)
  # rather than reacting via workflow_run, which runs against the default
  # branch and makes ref handling error-prone.
  workflow_call: {}
  workflow_dispatch: {}

# Read-only by default; a job that needs more says so itself.
permissions:
  contents: read

# A new push to a PR cancels that PR's run still in progress. Every other run
# (the deploy gate on main) gets a group of its own and is never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Decides which jobs below have anything to check. A job whose paths did
  # not change is skipped, and a skipped job does not fail the run. A manual
  # dispatch checks everything.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web == 'true' }}
      desktop: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.desktop == 'true' }}
      compose: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.compose == 'true' }}
      vulncheck: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.vulncheck == 'true' }}
      installer: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.installer == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name != 'workflow_dispatch'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          # Empty token: diff with git instead of the PR-files API, which
          # would need pull-requests: read — more than deploy.yml grants
          # the workflow it calls.
          token: ''
          # ci.yml, the Dockerfile and the root npm manifests feed every job
          # that uses them, so a change there re-checks those jobs.
          filters: |
            shared: &shared
              - .github/workflows/ci.yml
              - Dockerfile
              - .dockerignore
            npm: &npm
              - *shared
              - package.json
              - package-lock.json
              - packages/**
            backend:
              - *shared
              - backend/**
              # internal/theme runs the theme fixtures packages/theme shares.
              - packages/theme/fixtures/**
            vulncheck:
              - *shared
              - backend/**
              - .github/workflows/ci.yml
            web:
              - *npm
              - web/**
              - vercel.json
            desktop:
              - *npm
              - desktop/**
              - .github/workflows/release.yml
              - scripts/release-notes.sh
            installer:
              - .github/workflows/ci.yml
              - .github/workflows/release.yml
              - installer/**
            compose:
              - *shared
              - compose.yaml
              - compose.prod.yaml
              - Caddyfile
              - monitoring/**
              - db/**
              - secrets/**
              - .sops.yaml
              - scripts/**
              - Caddyfile

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    # For the tests that need a real database or Redis (skipped under
    # -short and when their *_TEST_URL is unset). Same images as compose.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: skillissues
          POSTGRES_PASSWORD: skillissues
          POSTGRES_DB: skillissues
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U skillissues"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [ '6379:6379' ]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
          cache-dependency-path: backend/go.sum
      - name: Go vet
        run: |
          cd backend
          go vet ./...
      - name: gofmt
        run: |
          cd backend
          test -z "$(gofmt -l .)" || { echo "gofmt drift in:"; gofmt -l .; exit 1; }
      - name: Go build
        run: |
          cd backend
          go build ./...
      - name: Go test (unit, no integration)
        run: |
          cd backend
          go test -short ./...
      - name: Go test (Postgres and Redis)
        # ./internal/... only: the root integration test needs a running API.
        env:
          DATABASE_URL: postgresql://skillissues:skillissues@localhost:5432/skillissues
          TEST_DATABASE_URL: postgresql://skillissues:skillissues@localhost:5432/skillissues
          REDIS_TEST_URL: redis://localhost:6379/15
        run: |
          cd backend
          go run ./cmd/migrate
          # -p 1: these packages share one database, and run side by side
          # one's table-wide UPDATE can deadlock against another's writes.
          go test -count=1 -p 1 ./internal/...

  # Known-vulnerable dependencies that the code actually reaches. Runs when the
  # backend changes; a CVE published against unchanged code is Dependabot's
  # job (.github/dependabot.yml), which opens the bump PR this job then checks.
  vulncheck:
    needs: changes
    if: needs.changes.outputs.vulncheck == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
          cache-dependency-path: backend/go.sum
      - name: govulncheck
        run: |
          cd backend
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Install
        # web, desktop and packages/* are one npm workspace (root
        # package.json) — a single install at the root resolves
        # @skillissues/client, @skillissues/theme and
        # @skillissues/markdown as real node_modules symlinks. Node 22's bundled
        # npm (10.9.x) has a known bug where `npm ci` hard-fails on an
        # unrelated optionalDependency's platform mismatch instead of
        # skipping it, once enough workspace members (desktop's
        # electron-builder) pull in enough platform-specific optional
        # deps — same fix as the root Dockerfile.
        run: |
          npm install -g npm@11
          npm ci
      - name: Typecheck
        run: |
          (cd packages/client && npx tsc --noEmit -p .)
          (cd packages/theme && npm run typecheck)
          cd web
          npm run typecheck
      - name: Theme checks
        # The same accept/refuse fixtures backend/internal/theme runs, so the
        # app and the server never disagree about a theme.
        run: |
          cd packages/theme
          npm test
      - name: Build
        # The real build, which also prerenders the landing and content
        # pages: it is what catches a broken workspace import or a page
        # that throws while rendering.
        run: |
          cd web
          npm run build

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Install
        # Same reason as the web job's install step above.
        run: |
          npm install -g npm@11
          npm ci
      - name: Check
        run: |
          cd desktop
          npm run check
      - name: Security rules
        # security.ts holds the app's boundaries (window flags, API allowlist,
        # link allowlist, workspace containment, how the push token reaches
        # git); these tests pin them.
        run: |
          cd desktop
          npm test
      - name: Build
        # electron-vite build is what actually catches a renderer import
        # breaking at the bundler level (e.g. a packages/* workspace
        # resolution issue `tsc --noEmit` wouldn't surface).
        run: |
          cd desktop
          npm run build

  # The Windows installer, built as release.yml builds it but unsigned and
  # unpublished: its pages (welcome, license, install mode and folder) and the
  # NSIS script can only be checked by building it, and a broken installer
  # must not first show up in a release.
  desktop-installer:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Install
        run: npm ci
      - name: Build the installer
        run: |
          cd desktop
          npm run dist:win
      - name: The installer is there
        shell: bash
        run: ls -la desktop/dist/*.exe

  images:
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check secrets are encrypted
        # Nothing under secrets/ may be plaintext, and no age private key may
        # be committed. Cheap, so it runs whenever this job does.
        run: scripts/check-secrets-encrypted.sh
      - name: Validate Docker Compose configuration (dev + prod)
        # compose.prod.yaml requires several secrets to be set (POSTGRES_PASSWORD,
        # ADMIN_SYNC_TOKEN, ...) via `:?` — CI supplies throwaway values just
        # so `config` can resolve the file; nothing here is a real credential.
        run: |
          docker compose -f compose.yaml config --quiet
          POSTGRES_PASSWORD=ci \
          FRONTEND_URL=https://ci.example.com \
          GITHUB_REDIRECT_URI=https://api.ci.example.com/auth/github/callback API_DOMAIN=api.ci.example.com \
          GITHUB_WEBHOOK_SECRET=ci ADMIN_SYNC_TOKEN=ci \
          METRICS_DB_PASSWORD=ci API_DB_PASSWORD=ci INGEST_DB_PASSWORD=ci FLOW_DB_PASSWORD=ci \
          GRAFANA_ADMIN_PASSWORD=ci GRAFANA_SECRET_KEY=ci STREAM_DOMAIN=stream.ci.example.com \
            docker compose -f compose.prod.yaml config --quiet
      - name: Validate Caddyfile
        # The image compose.prod.yaml runs, so a directive it does not know fails here.
        run: |
          image="$(grep -A1 '^  caddy:' compose.prod.yaml | sed -n 's/^ *image: //p')"
          docker run --rm -e STREAM_DOMAIN=stream.ci.example.com -e API_DOMAIN=api.ci.example.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" "$image" \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Set up Docker Buildx
        if: needs.changes.outputs.backend == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build api target
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build ingestd target
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: ingestd
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build flowd target
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: flowd
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build migrate target
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: migrate
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The Windows setup (installer/): its logic is tested on Linux, and it is
  # built for Windows exactly as release.yml builds it.
  installer:
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
          cache-dependency-path: installer/go.sum
      - name: gofmt and vet
        working-directory: installer
        run: |
          test -z "$(gofmt -l .)" || { echo "gofmt drift in:"; gofmt -l .; exit 1; }
          go vet ./...
          GOOS=windows go vet ./...
      - name: Test
        working-directory: installer
        run: go test ./...
      - name: Build for Windows
        working-directory: installer
        run: |
          go run github.com/tc-hib/go-winres@v0.3.3 make --in winres/winres.json --arch amd64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-H windowsgui -s -w" -o SkillIssues-Installer.exe .
