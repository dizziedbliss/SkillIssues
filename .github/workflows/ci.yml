name: CI Quality and Build Verification

on:
  push:
    branches: [ main, ship, refactor ]
  pull_request:
    branches: [ main, ship ]

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go/go.sum
      - name: Go vet
        run: |
          cd go
          go vet ./...
      - name: Go test (unit, no integration)
        run: |
          cd go
          go test -v -short ./...

  lint-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and Check Frontend
        run: |
          cd frontend
          npm ci
          npx tsc --noEmit
      - name: Install and Check Electron
        run: |
          cd electron
          npm ci
          npm run check

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
