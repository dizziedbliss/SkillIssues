name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main, ship ]
  # Lets deploy.yml depend on this workflow directly (needs: ci-job-names)
  # rather than reacting via workflow_run, which runs against the default
  # branch and makes ref handling error-prone.
  workflow_call: {}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      - name: Go vet
        run: |
          cd backend
          go vet ./...
      - name: gofmt
        run: |
          cd backend
          test -z "$(gofmt -l .)" || { echo "gofmt drift in:"; gofmt -l .; exit 1; }
      - name: Go build
        run: |
          cd backend
          go build ./...
      - name: Go test (unit, no integration)
        run: |
          cd backend
          go test -short ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        # web, desktop and packages/* are one npm workspace (root
        # package.json) — a single install at the root resolves
        # @skillissues/markdown, @skillissues/api-client and
        # @skillissues/ui as real node_modules symlinks. Node 22's bundled
        # npm (10.9.x) has a known bug where `npm ci` hard-fails on an
        # unrelated optionalDependency's platform mismatch instead of
        # skipping it, once enough workspace members (desktop's
        # electron-builder) pull in enough platform-specific optional
        # deps — same fix as the root Dockerfile.
        run: |
          npm install -g npm@11
          npm ci
      - name: Typecheck
        run: |
          cd web
          npm run typecheck
      - name: Build
        # The real build, not just tsc --noEmit: this is what actually
        # catches a broken packages/markdown import, since typecheck alone
        # does not exercise Vite's module resolution the same way.
        run: |
          cd web
          npm run build

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        # Same reason as the web job's install step above.
        run: |
          npm install -g npm@11
          npm ci
      - name: Check
        run: |
          cd desktop
          npm run check
      - name: Build
        # electron-vite build is what actually catches a renderer import
        # breaking at the bundler level (e.g. a packages/* workspace
        # resolution issue `tsc --noEmit` wouldn't surface).
        run: |
          cd desktop
          npm run build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration (dev + prod)
        # compose.prod.yaml requires several secrets to be set (POSTGRES_PASSWORD,
        # TOKEN_ENCRYPTION_KEY, ...) via `:?` — CI supplies throwaway values just
        # so `config` can resolve the file; nothing here is a real credential.
        run: |
          docker compose -f compose.yaml config --quiet
          POSTGRES_PASSWORD=ci DOMAIN=ci.example.com \
          FRONTEND_URL=https://ci.example.com \
          GITHUB_REDIRECT_URI=https://ci.example.com/api/auth/github/callback \
          GITHUB_WEBHOOK_SECRET=ci ADMIN_SYNC_TOKEN=ci TOKEN_ENCRYPTION_KEY=ci \
            docker compose -f compose.prod.yaml config --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build api target
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build ingestd target
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ingestd
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build migrate target
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web target
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=/api
