name: Build, Publish and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: >
          Existing sha-<short> tag to deploy instead of building a new one
          (redeploy/rollback). Leave empty to build from this ref as usual.
        required: false
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: dizziedbliss

jobs:
  # A deploy literally cannot run without CI passing — this job IS that gate,
  # not a status check next to it.
  ci:
    if: ${{ !github.event.inputs.image_tag }}
    uses: ./.github/workflows/ci.yml

  build-push:
    needs: [ ci ]
    # Skip entirely on a rollback dispatch (image_tag given) — there's
    # nothing to build, the deploy job just redeploys the named tag.
    if: ${{ !github.event.inputs.image_tag }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write       # push to GHCR
      id-token: write       # keyless cosign signature and the provenance attestation
      attestations: write   # attest-build-provenance
    outputs:
      image_tag: ${{ steps.tag.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compute image tag
        id: tag
        run: echo "sha_tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # linux/amd64 only: the VPS is x86_64 and the Dockerfile already pins
      # GOARCH=amd64, so skipping QEMU multi-arch keeps these builds fast.
      - name: Build and push api
        id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: api
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/skillissues-api:${{ steps.tag.outputs.sha_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/skillissues-api:latest

      - name: Build and push ingestd
        id: ingestd
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: ingestd
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/skillissues-ingestd:${{ steps.tag.outputs.sha_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/skillissues-ingestd:latest

      - name: Build and push flowd
        id: flowd
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: flowd
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/skillissues-flowd:${{ steps.tag.outputs.sha_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/skillissues-flowd:latest

      - name: Build and push migrate
        id: migrate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: migrate
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/skillissues-migrate:${{ steps.tag.outputs.sha_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/skillissues-migrate:latest

      - name: Build and push web
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: web
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=/api
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/skillissues-web:${{ steps.tag.outputs.sha_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/skillissues-web:latest

      # Provenance and a signature for each pushed image, by digest. Tags are
      # mutable; the host (deploy-remote.sh) refuses an image whose digest does
      # not carry a signature from this workflow on main.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Attest provenance (api)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/skillissues-api
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true

      - name: Attest provenance (ingestd)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/skillissues-ingestd
          subject-digest: ${{ steps.ingestd.outputs.digest }}
          push-to-registry: true

      - name: Attest provenance (flowd)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/skillissues-flowd
          subject-digest: ${{ steps.flowd.outputs.digest }}
          push-to-registry: true

      - name: Attest provenance (migrate)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/skillissues-migrate
          subject-digest: ${{ steps.migrate.outputs.digest }}
          push-to-registry: true

      - name: Attest provenance (web)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/skillissues-web
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true

      - name: Sign images with cosign (keyless)
        env:
          PREFIX: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          INGESTD_DIGEST: ${{ steps.ingestd.outputs.digest }}
          FLOWD_DIGEST: ${{ steps.flowd.outputs.digest }}
          MIGRATE_DIGEST: ${{ steps.migrate.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          set -euo pipefail
          for pair in "api:$API_DIGEST" "ingestd:$INGESTD_DIGEST" "flowd:$FLOWD_DIGEST" "migrate:$MIGRATE_DIGEST" "web:$WEB_DIGEST"; do
            name="${pair%%:*}"
            digest="${pair#*:}"
            if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "no digest for $name — refusing to continue unsigned" >&2
              exit 1
            fi
            # The runner's cosign is v3, whose default is the new bundle format that a
            # v2 verifier does not look for ("no signatures found"). The legacy
            # signature is read by both v2 and v3, so the host's version does not matter.
            cosign sign --yes --use-signing-config=false --new-bundle-format=false "$PREFIX/skillissues-$name@$digest"
          done

  deploy:
    needs: [ build-push ]
    # Runs after a normal build (build-push succeeded) OR on a rollback
    # dispatch (image_tag supplied — ci and build-push are BOTH
    # deliberately skipped in that case, per their own `if:` above).
    #
    # Checking needs.build-push.result == 'skipped' alone is wrong and was
    # a real bug: build-push also reports 'skipped' when it never ran
    # because its upstream `ci` job *failed* on an ordinary push — that is
    # not a rollback, there is no tag to deploy, and this job must not run
    # at all in that case (a run on 2026-10-13 did exactly this and only
    # failed to actually deploy anything because the tag-resolution step
    # below happened to catch the empty tag; this `if` is the actual fix,
    # that guard is defense in depth, not the mechanism).
    if: ${{ always() && (needs.build-push.result == 'success' || (github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag != '')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve image tag to deploy
        id: tag
        env:
          # Passed through env, never interpolated into the script: a
          # workflow_dispatch input is attacker-shaped text.
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
          BUILT_TAG: ${{ needs.build-push.outputs.image_tag }}
        run: |
          tag="${INPUT_TAG:-$BUILT_TAG}"
          if [ -z "$tag" ]; then
            echo "no image tag resolved — nothing to deploy" >&2
            exit 1
          fi
          if ! printf '%s' "$tag" | grep -Eq '^sha-[0-9a-f]{7,40}$'; then
            echo "image tag is not sha-<hex>: refusing to deploy" >&2
            exit 1
          fi
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy compose file, Caddyfile, monitoring, db and systemd config, scripts and encrypted secrets to host
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          scp -r -i ~/.ssh/deploy_key -P "$VPS_SSH_PORT" -o UserKnownHostsFile=~/.ssh/known_hosts \
            compose.prod.yaml Caddyfile monitoring db systemd \
            scripts/deploy-remote.sh scripts/decrypt-env.sh scripts/backup-db.sh \
            "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/"
          # The secrets stay encrypted in transit and at rest on the runner: this
          # job holds no age key. The host decrypts them (decrypt-env.sh).
          if [ -f secrets/prod.env.sops ]; then
            scp -i ~/.ssh/deploy_key -P "$VPS_SSH_PORT" -o UserKnownHostsFile=~/.ssh/known_hosts \
              secrets/prod.env.sops "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/secrets/prod.env.sops"
          fi

      # The actual pull/up/health-wait/prune logic lives in
      # scripts/deploy-remote.sh (committed, tested locally) rather than
      # inline here — embedding that in an SSH heredoc from inside a GitHub
      # Actions expression is a quoting nightmare not worth repeating.
      - name: Run deploy script on host
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_SSH_PORT" -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$VPS_USER@$VPS_HOST" \
            "cd '$DEPLOY_PATH' && chmod +x deploy-remote.sh decrypt-env.sh backup-db.sh && ./deploy-remote.sh '$IMAGE_TAG'"
