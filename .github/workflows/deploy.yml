name: Build, Publish and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: >
          Existing sha-<short> tag to deploy instead of building a new one
          (redeploy/rollback). Leave empty to build from this ref as usual.
        required: false
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: dizziedbliss

jobs:
  # A deploy literally cannot run without CI passing — this job IS that gate,
  # not a status check next to it.
  ci:
    if: ${{ !github.event.inputs.image_tag }}
    uses: ./.github/workflows/ci.yml

  build-push:
    needs: [ ci ]
    # Skip entirely on a rollback dispatch (image_tag given) — there's
    # nothing to build, the deploy job just redeploys the named tag.
    if: ${{ !github.event.inputs.image_tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "sha_tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # linux/amd64 only: the VPS is x86_64 and the Dockerfile already pins
      # GOARCH=amd64, so skipping QEMU multi-arch keeps these builds fast.
      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/skillissues-api:${{ steps.tag.outputs.sha_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/skillissues-api:latest

      - name: Build and push ingestd
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ingestd
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/skillissues-ingestd:${{ steps.tag.outputs.sha_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/skillissues-ingestd:latest

      - name: Build and push migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/skillissues-migrate:${{ steps.tag.outputs.sha_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/skillissues-migrate:latest

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=/api
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/skillissues-web:${{ steps.tag.outputs.sha_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/skillissues-web:latest

  deploy:
    needs: [ build-push ]
    # Runs after a normal build (build-push succeeded) OR on a rollback
    # dispatch (image_tag supplied — ci and build-push are BOTH
    # deliberately skipped in that case, per their own `if:` above).
    #
    # Checking needs.build-push.result == 'skipped' alone is wrong and was
    # a real bug: build-push also reports 'skipped' when it never ran
    # because its upstream `ci` job *failed* on an ordinary push — that is
    # not a rollback, there is no tag to deploy, and this job must not run
    # at all in that case (a run on 2026-10-13 did exactly this and only
    # failed to actually deploy anything because the tag-resolution step
    # below happened to catch the empty tag; this `if` is the actual fix,
    # that guard is defense in depth, not the mechanism).
    if: ${{ always() && (needs.build-push.result == 'success' || (github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag != '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag to deploy
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            tag="${{ github.event.inputs.image_tag }}"
          else
            tag="${{ needs.build-push.outputs.image_tag }}"
          fi
          if [ -z "$tag" ]; then
            echo "no image tag resolved — nothing to deploy" >&2
            exit 1
          fi
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy compose file, Caddyfile, monitoring config and deploy script to host
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          scp -r -i ~/.ssh/deploy_key -P "$VPS_SSH_PORT" -o UserKnownHostsFile=~/.ssh/known_hosts \
            compose.prod.yaml Caddyfile monitoring scripts/deploy-remote.sh \
            "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/"

      # The actual pull/up/health-wait/prune logic lives in
      # scripts/deploy-remote.sh (committed, tested locally) rather than
      # inline here — embedding that in an SSH heredoc from inside a GitHub
      # Actions expression is a quoting nightmare not worth repeating.
      - name: Run deploy script on host
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_SSH_PORT" -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$VPS_USER@$VPS_HOST" \
            "chmod +x $DEPLOY_PATH/deploy-remote.sh && $DEPLOY_PATH/deploy-remote.sh $IMAGE_TAG"
