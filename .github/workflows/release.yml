name: Release Binaries and Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Every release has notes: the tag's section of desktop/release-notes.md.
  # Checked before anything builds, so a tag without them fails in seconds.
  notes:
    name: Release notes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Find this version's notes
        run: scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > /dev/null

  build-desktop:
    name: Build Desktop App
    needs: notes
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      # One npm workspace: install at the root, never inside desktop/.
      - name: Install Dependencies
        run: npm ci
      # The app's version is the tag's: the updater compares it with
      # latest*.yml to decide whether there's an update.
      - name: Set the version from the tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version -w desktop
      # Signed when a code-signing certificate is configured (secrets
      # WIN_CSC_LINK, a base64 .pfx, and WIN_CSC_KEY_PASSWORD); unsigned until
      # then, which is why Windows warns about the download.
      - name: Package Windows Executable
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$WIN_CSC_LINK" ]; then unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; fi
          cd desktop
          npm run dist:win
      # The setup people download from the site: a small branded window that
      # fetches the newest SkillIssues-Setup-*.exe from this release, checks
      # its SHA-512 against latest.yml and runs it silently (installer/).
      - name: Set up Go
        if: matrix.os == 'windows-latest'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
          cache-dependency-path: installer/go.sum
      - name: Build the Windows setup
        if: matrix.os == 'windows-latest'
        shell: bash
        working-directory: installer
        run: |
          v="${GITHUB_REF_NAME#v}"
          go run github.com/tc-hib/go-winres@v0.3.3 make --in winres/winres.json --arch amd64 --product-version "${v%%-*}.0" --file-version "${v%%-*}.0"
          CGO_ENABLED=0 go build -trimpath -ldflags "-H windowsgui -s -w" -o ../desktop/dist/SkillIssues-Installer.exe .
      - name: Package Linux AppImage
        if: matrix.os == 'ubuntu-24.04'
        run: |
          cd desktop
          npm run dist:linux
      - name: Package macOS DMG
        if: matrix.os == 'macos-latest'
        run: |
          cd desktop
          npm run dist:mac
      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml

  create-release:
    name: Create GitHub Release
    needs: build-desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download Build Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release-assets
      - name: Write the release notes
        run: |
          scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md
          printf '\n---\n\n**Download** the file for your system below: `SkillIssues-Installer.exe` for Windows (or `SkillIssues-Setup-*.exe`, the full offline installer), `*.dmg` for macOS (Apple silicon), `*.AppImage` for Linux. Or get the newest from https://skillissues.dizziedbliss.lol/download.\n' >> release-notes.md
      - name: Create GitHub Release with Assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: SkillIssues ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: release-assets/**/*
