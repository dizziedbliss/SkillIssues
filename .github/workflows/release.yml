name: Release Binaries and Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-desktop:
    name: Build Desktop App
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Dependencies
        run: |
          cd desktop
          npm ci
      - name: Package Windows Executable
        if: matrix.os == 'windows-latest'
        run: |
          cd desktop
          npm run dist:win
      - name: Package Linux AppImage
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd desktop
          npm run dist:linux
      - name: Package macOS DMG
        if: matrix.os == 'macos-latest'
        run: |
          cd desktop
          npm run dist:mac
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.dmg
            desktop/dist/*.zip

  create-release:
    name: Create GitHub Release
    needs: build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Create GitHub Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          name: SkillIssues ${{ github.ref_name }}
          body: |
            ## SkillIssues ${{ github.ref_name }} Release

            **SkillIssues** — the intelligent developer issue matching and desktop contribution engine.

            ### Highlights
            - **Desktop App Suite**: Native workspace creation, automated branch handling, live Git progress tracker, and VS Code 1-click launcher.
            - **Web-to-Desktop Deep Linking**: Browse issues on the web and immediately start solving them inside the desktop client via `skillissues://`.
            - **Continuously Growing Catalog**: Real open-source issues from eligible repositories, crawled continuously, with difficulty ratings and author metadata.
            - **Sandboxed Git Operations**: Workspace isolation and subprocess safeguards around every fork/clone/branch/push.

            ### Download Desktop Client
            Download the installer for your operating system below!
          draft: false
          prerelease: false
          files: release-assets/**/*
