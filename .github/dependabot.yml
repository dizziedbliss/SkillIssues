version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [ minor, patch ]

  # Keeps the SHA pins in .github/workflows current (the version after the
  # `#` is what it bumps).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: [ '*' ]

  # Root Dockerfile base images.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # Image digests pinned in compose.yaml / compose.prod.yaml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A Postgres major version can't read the previous one's data files:
      # it needs a dump and restore (or pg_upgrade) on the host, planned by
      # hand, never a digest bump.
      - dependency-name: postgres
        update-types: [ version-update:semver-major ]
