name: skillissues-prod

# Production deploy for the VPS. Every service pulls a pre-built image from
# GHCR — nothing here has a `build:` stanza, because the VPS should never
# compile Go or run npm. Images are published by .github/workflows/deploy.yml.
#
# IMAGE_TAG should always be an explicit sha-<short> tag in a real deploy
# (never `latest` — that exists only for convenience, e.g. `docker pull` to
# inspect the newest image). The deploy job always passes one explicitly;
# the `latest` fallback below exists only so this file is runnable by hand
# while testing.
#
# <API|INGESTD|FLOWD|MIGRATE|WEB>_IMAGE override the whole reference. deploy-remote.sh
# sets them to tag@sha256:<digest> after verifying the cosign signature, so what
# runs is the exact image that was verified, not whatever the tag points at later.
#
# Sized for the provisioned host: Debian 13, 2 vCPU, 4 GB RAM, 40 GB disk.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  default:
    name: skillissues_prod_net
    ipam:
      config:
        # Fixed subnet so TRUSTED_PROXIES below is a real value, not a
        # guess — Docker's default bridge gets a subnet assigned at
        # creation time that this file can't know in advance.
        - subnet: 172.28.0.0/24
  # The Docker API, through docker-socket-proxy: only it and Alloy are on this
  # network, and it has no route out. Nothing else can reach Docker.
  docker-api:
    name: skillissues_docker_api
    internal: true

services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    shm_size: ${PG_SHM_SIZE:-256mb}
    mem_limit: ${PG_MEM_LIMIT:-1536m}
    cpus: ${PG_CPUS:-1.0}
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skillissues}
      POSTGRES_USER: ${POSTGRES_USER:-skillissues}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
    # Tuned for 4GB/2vCPU. shared_buffers + effective_cache_size are sized
    # to leave headroom for Redis, go-api, ingestd and Caddy on the same
    # host; max_connections=60 covers api(15) + ingestd(10) + migrate +
    # each service's settings-reload LISTEN connection, with room to spare
    # over the 42-connection worst case measured against the old
    # max_connections=40.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-768MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - work_mem=${PG_WORK_MEM:-8MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-60}
      - -c
      - max_parallel_workers_per_gather=${PG_MAX_PARALLEL_WORKERS_PER_GATHER:-1}
      # The VPS disk is SSD; Postgres' default of 4 prices an index lookup as
      # a spinning-disk seek and picks sequential scans of every issue where
      # a few thousand index lookups would do (counting a language's issues
      # took 990ms at 4 and 14ms at 1.1).
      - -c
      - random_page_cost=${PG_RANDOM_PAGE_COST:-1.1}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skillissues} -d ${POSTGRES_DB:-skillissues}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Rate-limit counters and cached responses only; sessions resolve from
  # Postgres, so an empty Redis on restart costs latency, never correctness.
  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    restart: unless-stopped
    mem_limit: ${REDIS_MEM_LIMIT:-320m}
    cpus: ${REDIS_CPUS:-0.25}
    logging: *default-logging
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: ${MIGRATE_IMAGE:-ghcr.io/dizziedbliss/skillissues-migrate:${IMAGE_TAG:-latest}}
    mem_limit: ${MIGRATE_MEM_LIMIT:-256m}
    cpus: ${MIGRATE_CPUS:-0.5}
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-skillissues}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-skillissues}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # One-shot: enables login for the least-privilege roles migration 00029
  # and 00033 create (go-api connects as skillissues_api, ingestd as
  # skillissues_ingest, flowd as skillissues_flow, never as the owner). Runs after every migrate so a rotated password lands.
  app-roles:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    mem_limit: 64m
    cpus: 0.25
    logging: *default-logging
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-skillissues}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-skillissues}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?API_DB_PASSWORD must be set in production}
      INGEST_DB_PASSWORD: ${INGEST_DB_PASSWORD:?INGEST_DB_PASSWORD must be set in production}
      FLOW_DB_PASSWORD: ${FLOW_DB_PASSWORD:?FLOW_DB_PASSWORD must be set in production}
    volumes:
      - ./db/app-roles.sql:/app-roles.sql:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-q", "-f", "/app-roles.sql"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  go-api:
    image: ${API_IMAGE:-ghcr.io/dizziedbliss/skillissues-api:${IMAGE_TAG:-latest}}
    restart: unless-stopped
    mem_limit: ${API_MEM_LIMIT:-384m}
    cpus: ${API_CPUS:-0.5}
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql://skillissues_api:${API_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-skillissues}
      DB_MAX_CONNS: ${API_DB_MAX_CONNS:-15}
      # Keeps label bitmaps exact (internal/config/env.go DBWorkMemMB); at
      # most pool size x this, and only while queries sort or build bitmaps.
      DB_WORK_MEM_MB: ${API_DB_WORK_MEM_MB:-32}
      REDIS_URL: redis://redis:6379/0
      # https:// is mandatory here, not cosmetic: the session cookie is
      # only marked Secure when FRONTEND_URL starts with https://, and
      # same-origin (API under /api/ on this same host) is what makes
      # the OAuth login flow work without any cross-origin cookie dance.
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be the production https:// origin, e.g. https://skillissues.dizziedbliss.lol}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_LOGIN_CLIENT_ID: ${GITHUB_LOGIN_CLIENT_ID:-}
      GITHUB_LOGIN_CLIENT_SECRET: ${GITHUB_LOGIN_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:?GITHUB_REDIRECT_URI must be https://<API_DOMAIN>/auth/github/callback}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?GITHUB_WEBHOOK_SECRET must be set in production}
      ADMIN_SYNC_TOKEN: ${ADMIN_SYNC_TOKEN:?ADMIN_SYNC_TOKEN must be set in production}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github-app-private-key.pem
      SYNCD_URL: http://ingestd:8002
      # Caddy is the only other container that talks to go-api, and it
      # always comes from this network — so this is a real, exact value,
      # not a guess at "whatever the proxy's IP turns out to be".
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.28.0.0/24}
      ENV: production
      PORT: 8000
    # No published port: Caddy is the only ingress. go-api is reachable by
    # other containers on skillissues_prod_net only.
    volumes:
      - ${GITHUB_APP_PRIVATE_KEY_HOST_PATH:-/dev/null}:/run/secrets/github-app-private-key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app-roles:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  ingestd:
    image: ${INGESTD_IMAGE:-ghcr.io/dizziedbliss/skillissues-ingestd:${IMAGE_TAG:-latest}}
    restart: unless-stopped
    mem_limit: ${INGESTD_MEM_LIMIT:-512m}
    cpus: ${INGESTD_CPUS:-0.75}
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql://skillissues_ingest:${INGEST_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-skillissues}
      DB_MAX_CONNS: ${INGESTD_DB_MAX_CONNS:-10}
      # Publishing live flow events only; the crawl runs the same without it.
      REDIS_URL: redis://redis:6379/0
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ADMIN_SYNC_TOKEN: ${ADMIN_SYNC_TOKEN:?ADMIN_SYNC_TOKEN must be set in production}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github-app-private-key.pem
      SYNCD_PORT: 8002
      ENV: production
      PORT: 8002
    # Internal only. ingestd's /sync/* endpoints have no auth of their own,
    # so they must never be reachable from outside skillissues_prod_net.
    volumes:
      - ${GITHUB_APP_PRIVATE_KEY_HOST_PATH:-/dev/null}:/run/secrets/github-app-private-key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      app-roles:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  # Relays go-api's and ingestd's flow events to the public live visualizer.
  # No published port: Caddy proxies only /stream on STREAM_DOMAIN to it.
  # It reads its settings as skillissues_flow (SELECT on settings, nothing
  # else) and holds no other credential.
  flowd:
    image: ${FLOWD_IMAGE:-ghcr.io/dizziedbliss/skillissues-flowd:${IMAGE_TAG:-latest}}
    restart: unless-stopped
    mem_limit: ${FLOWD_MEM_LIMIT:-96m}
    cpus: ${FLOWD_CPUS:-0.25}
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql://skillissues_flow:${FLOW_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-skillissues}
      DB_MAX_CONNS: ${FLOWD_DB_MAX_CONNS:-2}
      REDIS_URL: redis://redis:6379/0
      PROMETHEUS_URL: http://prometheus:9090
      # The visualizer site (Vercel). Browsers from any other origin get 403.
      FLOW_ALLOWED_ORIGINS: ${FLOW_ALLOWED_ORIGINS:-https://flow.dizziedbliss.lol}
      ENV: production
      PORT: 8003
    depends_on:
      redis:
        condition: service_healthy
      app-roles:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  # The site is on Vercel (vercel.json); Caddy serves only the API and the stream.
  caddy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    mem_limit: ${CADDY_MEM_LIMIT:-128m}
    cpus: ${CADDY_CPUS:-0.25}
    logging: *default-logging
    environment:
      STREAM_DOMAIN: ${STREAM_DOMAIN:?STREAM_DOMAIN must be set, e.g. stream.dizziedbliss.lol}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN must be set, e.g. skillissues-api.dizziedbliss.lol}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      go-api:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # Monitoring. Nothing here is published publicly: Grafana and Prometheus
  # bind to 127.0.0.1 and are reached over `ssh -L`. Limits sum to ~640m on top of the ~3.0g above; actual use
  # is well below the caps. Every limit is overridable from .env.
  # --------------------------------------------------------------------------

  # One-shot: enables login for the metrics_ro role (migration 00017) with
  # METRICS_DB_PASSWORD. Runs after every migrate so a rotated password lands.
  metrics-role:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    mem_limit: 64m
    cpus: 0.25
    logging: *default-logging
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-skillissues}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-skillissues}
      METRICS_DB_PASSWORD: ${METRICS_DB_PASSWORD:?METRICS_DB_PASSWORD must be set in production}
    volumes:
      - ./monitoring/metrics-role.sql:/metrics-role.sql:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-q", "-f", "/metrics-role.sql"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    restart: unless-stopped
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-256m}
    cpus: ${PROMETHEUS_CPUS:-0.25}
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/scrape.prod:/etc/prometheus/scrape.d:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    restart: unless-stopped
    mem_limit: ${GRAFANA_MEM_LIMIT:-512m}
    cpus: ${GRAFANA_CPUS:-0.25}
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in production}
      # Encrypts the secrets Grafana stores (the metrics_ro datasource
      # password, re-provisioned on every start). Grafana's built-in default
      # is public.
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:?GRAFANA_SECRET_KEY must be set in production}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Grafana 13 no longer bundles its datasources; it downloads them in the
      # background at startup, so panels fail until they land. Install the three
      # the dashboards use, pinned and synchronously, before the server starts.
      GF_PLUGINS_PREINSTALL_SYNC: prometheus@13.2.3,grafana-postgresql-datasource@13.0.4,loki@13.2.2
      # Grafana also fetches its default plugin bundle into grafana_data, and
      # every backend plugin in it runs as its own process. Loading all 17
      # pushed Grafana past 160m and into an OOM restart loop. Only the three
      # above are used, so the rest are installed but never loaded.
      # (PREINSTALL_DISABLED would skip the bundle but also the sync install.)
      GF_PLUGINS_DISABLE_PLUGINS: elasticsearch,influxdb,jaeger,mssql,mysql,opentsdb,tempo,zipkin,grafana-pyroscope-datasource,grafana-advisor-app,grafana-exploretraces-app,grafana-lokiexplore-app,grafana-metricsdrilldown-app,grafana-pyroscope-app
      POSTGRES_DB: ${POSTGRES_DB:-skillissues}
      METRICS_DB_PASSWORD: ${METRICS_DB_PASSWORD}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      metrics-role:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Logs that survive a redeploy: Alloy ships every container's output to Loki,
  # which keeps it on loki_data for LOKI_RETENTION_PERIOD (monitoring/loki).
  # Docker's own json-file logs go with the container a deploy recreates.
  # Read in Grafana. Loki's image has no shell for a healthcheck, so Prometheus
  # scrapes both: a stopped one shows as up == 0.
  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    restart: unless-stopped
    mem_limit: ${LOKI_MEM_LIMIT:-256m}
    cpus: ${LOKI_CPUS:-0.25}
    logging: *default-logging
    command:
      - -config.file=/etc/loki/loki.yml
      - -config.expand-env=true
    environment:
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD:-336h}
      # Go ignores the container's limit unless told; this keeps the heap
      # under mem_limit (it idles near 45 MiB).
      GOMEMLIMIT: ${LOKI_GOMEMLIMIT:-200MiB}
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki

  # The only thing holding the Docker socket for the log pipeline. A socket
  # mounted :ro still answers every API call (":ro" only stops the file being
  # replaced), which is root on the host; this proxy forwards GETs for listing
  # containers and networks and reading logs, and refuses everything else
  # (POST is off: no create, exec, start or delete).
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    mem_limit: ${SOCKET_PROXY_MEM_LIMIT:-48m}
    cpus: ${SOCKET_PROXY_CPUS:-0.1}
    logging: *default-logging
    environment:
      CONTAINERS: 1   # list containers, inspect them, read their logs
      NETWORKS: 1     # Alloy's discovery labels containers by network
      EVENTS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api

  alloy:
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    restart: unless-stopped
    mem_limit: ${ALLOY_MEM_LIMIT:-192m}
    cpus: ${ALLOY_CPUS:-0.2}
    logging: *default-logging
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    environment:
      # As for Loki: uncapped it grew to ~370 MiB; with this it idles near 45 MiB.
      GOMEMLIMIT: ${ALLOY_GOMEMLIMIT:-150MiB}
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    # default: Loki and Prometheus; docker-api: the proxy, never the socket.
    networks:
      - default
      - docker-api
    depends_on:
      - loki
      - docker-socket-proxy

  # Host network so it reports the real NIC; listens only on this compose
  # network's gateway (fixed subnet above), never on the public interface.
  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    restart: unless-stopped
    mem_limit: ${NODE_EXPORTER_MEM_LIMIT:-48m}
    cpus: ${NODE_EXPORTER_CPUS:-0.1}
    logging: *default-logging
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=172.28.0.1:9100
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    restart: unless-stopped
    mem_limit: ${CADVISOR_MEM_LIMIT:-96m}
    cpus: ${CADVISOR_CPUS:-0.15}
    logging: *default-logging
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
      - --disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl,memory_numa,advtcp,process
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    devices:
      - /dev/kmsg

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    restart: unless-stopped
    mem_limit: ${POSTGRES_EXPORTER_MEM_LIMIT:-48m}
    cpus: ${POSTGRES_EXPORTER_CPUS:-0.1}
    logging: *default-logging
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:-skillissues}?sslmode=disable
      DATA_SOURCE_USER: metrics_ro
      DATA_SOURCE_PASS: ${METRICS_DB_PASSWORD}
    depends_on:
      metrics-role:
        condition: service_completed_successfully

  redis-exporter:
    image: oliver006/redis_exporter:v1.94.0@sha256:0842ef7110e62b40bbde2d5c11f38c6fbd99f7100c75e3866637c1b335a1eff7
    restart: unless-stopped
    mem_limit: ${REDIS_EXPORTER_MEM_LIMIT:-32m}
    cpus: ${REDIS_EXPORTER_CPUS:-0.1}
    logging: *default-logging
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_prod_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
