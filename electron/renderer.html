<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillIssues Desktop</title>
  <link rel="stylesheet" href="renderer.css">
</head>
<body>
  <main class="home-shell">
    <header class="topbar"><div class="wordmark">SkillIssues<span>You Have the Skills. We Have the Issues.</span></div></header>
    <section class="searchbar"><span class="search-icon">⌕</span><input id="search" placeholder="Issues on JavaScript"><button id="clear-search">clear</button><button id="filter-button" title="Toggle filters">≡</button><button id="search-button">Search</button></section>
    <section class="home-grid"><div class="feed-column"><nav class="counts"><button class="active" data-tab="all">SkillIssues <b id="issue-count">0</b></button><button data-tab="saved">Saved <b>0</b></button><button data-tab="submissions">Submissions <b>0</b></button></nav><div class="feed-heading"><h1>SkillIssues</h1><span>Skill based recommendations</span></div><div id="issues" class="issues"><div class="loading">Loading challenges...</div></div></div><aside class="profile-rail"><img id="profile-avatar" class="avatar" alt="Profile avatar"><h2 id="profile-name">Profile</h2><p id="profile-handle" class="handle"></p><p id="profile-quote" class="quote">Build your next contribution.</p><section><label>Preferences</label><div id="profile-languages" class="chips"></div></section><section><label>Verified challenges</label><div id="profile-completed" class="chips"><span>0</span></div></section><div class="level"><span id="profile-level">BEGINNER</span><div><small>0</small><i id="profile-progress"></i><small>100</small></div></div></aside></section>
    <!-- ISSUE DETAILS stays separate from the fixed Documents/SkillIssues clone handoff. -->
    <div id="workspace" class="workspace-drawer" hidden><div class="drawer-card"><button id="close-workspace" class="close">×</button><span id="difficulty" class="difficulty"></span><h2 id="title"></h2><p id="repository"></p><a id="github" target="_blank" rel="noreferrer">Open issue ↗</a><p id="body" class="drawer-body"></p><div id="skills" class="drawer-skills"></div><button id="start-challenge" class="primary">Start challenge <span>↗</span></button><div id="clone-handoff" hidden><div class="destination"><label>LOCAL WORKSPACE</label><input id="destination" readonly value="Documents/SkillIssues" /></div><button id="clone" class="primary">Clone repository <span>↗</span></button><div id="git-actions" hidden><label>BRANCH AND PUSH</label><div class="destination-row"><input id="branch" value="skillissues/work" placeholder="skillissues/work"><button id="branch-button" class="secondary">Create branch</button><button id="push-button" class="secondary" disabled>Push</button><button id="open-workspace" class="secondary">Open workspace</button></div></div></div><div id="result" class="result" hidden></div></div></div>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
