<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src http://localhost:8000; img-src 'self' https: data:; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none';">
  <title>SkillIssues Desktop</title>
  <link rel="stylesheet" href="renderer.css">
</head>
<body>
  <main class="home-shell">
    <header class="topbar"><div class="wordmark">SkillIssues<span>You Have the Skills. We Have the Issues.</span></div><div class="auth-actions"><span id="auth-status">Demo mode</span><button id="github-login" class="auth-button">Connect GitHub</button><button id="demo-login" class="auth-button">Demo login</button><button id="logout" class="auth-button subtle">Log out</button></div></header>
    <section class="searchbar"><span class="search-icon">⌕</span><input id="search" placeholder="Issues on JavaScript"><button id="clear-search">clear</button><select id="difficulty-filter" title="Filter by difficulty"><option value="">All levels</option><option value="BEGINNER">Beginner</option><option value="INTERMEDIATE">Intermediate</option><option value="ADVANCED">Advanced</option></select><select id="sort-filter" title="Sort issues"><option value="recommended">Recommended</option><option value="difficulty-asc">Easiest first</option><option value="difficulty-desc">Hardest first</option><option value="recent">Recently updated</option></select><button id="search-button">Search</button></section>
    <section class="home-grid"><div class="feed-column"><nav class="counts"><button class="active" data-tab="all">SkillIssues <b id="issue-count">0</b></button><button data-tab="saved">Saved <b id="saved-count">0</b></button><button data-tab="working">Working <b id="working-count">0</b></button><button data-tab="submissions">Submissions <b id="submission-count">0</b></button></nav><div class="feed-heading"><h1>SkillIssues</h1><span id="feed-subtitle">Personalized for your current level and preferences</span></div><div id="issues" class="issues"><div class="loading">Loading challenges...</div></div></div><aside class="profile-rail"><img id="profile-avatar" class="avatar" alt="Profile avatar"><h2 id="profile-name">Profile</h2><p id="profile-handle" class="handle"></p><p id="profile-quote" class="quote">Build your next contribution.</p><section><label>Preferences</label><div id="profile-languages" class="chips"></div></section><section><label>Verified challenges</label><div id="profile-completed" class="chips"><span>0</span></div></section><div class="level"><span id="profile-level">BEGINNER</span><div><small>0</small><i id="profile-progress"></i><small>100</small></div></div></aside></section>
    <!-- ISSUE DETAILS stays separate from the fixed Documents/SkillIssues clone handoff. -->
    <div id="workspace" class="workspace-drawer" hidden><div class="drawer-card"><button id="close-workspace" class="close">×</button><span id="difficulty" class="difficulty"></span><h2 id="title"></h2><p id="repository"></p><a id="github" target="_blank" rel="noreferrer">Open issue ↗</a><p id="body" class="drawer-body"></p><div id="skills" class="drawer-skills"></div><button id="start-challenge" class="primary">Solve and track <span>↗</span></button><div id="clone-handoff" hidden><div class="destination"><label>LOCAL WORKSPACE</label><div id="destination" class="workspace-path">Documents/SkillIssues</div></div><button id="clone" class="primary">Clone repository <span>↗</span></button><div id="git-actions" hidden><label>BRANCH AND PUSH</label><div class="destination-row"><input id="branch" value="skillissues/work" placeholder="skillissues/work"><button id="branch-button" class="secondary">Create branch</button><button id="push-button" class="secondary" disabled>Push</button><button id="open-workspace" class="secondary">Show folder</button><button id="open-vscode" class="secondary">Open in VS Code</button><button id="submit-pr" class="secondary">Submit PR</button></div></div></div><div id="result" class="result" hidden></div></div></div>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
