apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skillissues-ingress
  namespace: skillissues
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://skillissues.com"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  tls:
    - hosts:
        - skillissues.com
        - api.skillissues.com
      secretName: skillissues-tls
  rules:
    - host: skillissues.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: skillissues-frontend
                port:
                  number: 5173
    - host: api.skillissues.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: skillissues-api
                port:
                  number: 8000
