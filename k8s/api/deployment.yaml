apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillissues-api
  namespace: skillissues
  labels:
    app: skillissues-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: skillissues-api
  template:
    metadata:
      labels:
        app: skillissues-api
    spec:
      containers:
        - name: api
          image: skillissues-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: skillissues-config
            - secretRef:
                name: skillissues-secrets
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: skillissues-api
  namespace: skillissues
  labels:
    app: skillissues-api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: skillissues-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: skillissues-api-hpa
  namespace: skillissues
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: skillissues-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
