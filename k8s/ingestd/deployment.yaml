apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillissues-ingestd
  namespace: skillissues
  labels:
    app: skillissues-ingestd
spec:
  replicas: 1 # Singleton coordinator
  selector:
    matchLabels:
      app: skillissues-ingestd
  template:
    metadata:
      labels:
        app: skillissues-ingestd
    spec:
      containers:
        - name: ingestd
          image: skillissues-ingestd:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
              name: http
          envFrom:
            - configMapRef:
                name: skillissues-config
            - secretRef:
                name: skillissues-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: skillissues-ingestd
  namespace: skillissues
  labels:
    app: skillissues-ingestd
spec:
  type: ClusterIP
  ports:
    - port: 8002
      targetPort: 8002
      name: http
  selector:
    app: skillissues-ingestd
