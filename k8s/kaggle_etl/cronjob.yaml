apiVersion: batch/v1
kind: CronJob
metadata:
  name: skillissues-kaggle-etl
  namespace: skillissues
  labels:
    app: skillissues-kaggle-etl
spec:
  # Run at 00:00 on day 1 of every 2nd month
  schedule: "0 0 1 */2 *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: kaggle-etl
              image: skillissues-kaggle-etl:latest
              command:
                - /kaggle_etl
                - --dataset
                - /data/repo_metadata.json
                - --batch-size
                - "500"
              envFrom:
                - configMapRef:
                    name: skillissues-config
                - secretRef:
                    name: skillissues-secrets
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: 2000m
                  memory: 4Gi
              volumeMounts:
                - name: app-code
                  mountPath: /app
          volumes:
            - name: app-code
              configMap:
                name: skillissues-config
