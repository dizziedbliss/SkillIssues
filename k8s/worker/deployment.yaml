apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillissues-worker
  namespace: skillissues
  labels:
    app: skillissues-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skillissues-worker
  template:
    metadata:
      labels:
        app: skillissues-worker
    spec:
      containers:
        - name: worker
          image: skillissues-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: API_URL
              value: "http://skillissues-api.skillissues.svc.cluster.local:8000"
            - name: SYNCD_URL
              value: "http://skillissues-syncd.skillissues.svc.cluster.local:8002"
            - name: SYNC_INTERVAL_SECONDS
              value: "900"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
