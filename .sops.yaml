# SOPS rules for the repo's encrypted secrets.
#
# Every file under secrets/ is encrypted to TWO age keys: yours (so you can
# edit it) and the VPS's (so deploy-remote.sh can decrypt it on the host).
# CI never holds either private key, so a compromised workflow sees only
# ciphertext.
#
# Replace both placeholders with the PUBLIC keys (age1...). The VPS private key
# lives only at /etc/skillissues/age.key on the host; yours stays off-host.
# Changing the recipient list takes effect for a file with:
#   sops updatekeys secrets/prod.env.sops
creation_rules:
  - path_regex: ^secrets/.*\.env\.sops$
    age: >-
      age12gqkdzq9etlpyy7c3z325v76d6ld0ds4skz3hrt33xpj73gznupqjupmct,
      age18hng5g06729c74j7mvxc63xuxhnav336amfg0wwajv3pnfe3xsesxl5u3s
