<svg width="111" height="111" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- SkillIssues mark: the wordmark's "i" turned over into a bang, knocked out of a solid tile. Ink and red from landing/tokens.module.css; inverted in a dark browser theme. -->
<style>
  .tile { fill: #26231f; }
  .stem { fill: #f1eee7; }
  .dot  { fill: #c8190b; }
  @media (prefers-color-scheme: dark) { .tile { fill: #f3f0ea; } .stem { fill: #26231f; } .dot { fill: #ff3322; } }
</style>
<rect x="4" y="4" width="92" height="92" rx="24" class="tile"/>
<rect x="42.5" y="16.5" width="15" height="42" rx="1.8" class="stem"/>
<circle cx="50" cy="74.5" r="9" class="dot"/>
</svg>
