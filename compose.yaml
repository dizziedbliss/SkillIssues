name: skillissues

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skillissues
      POSTGRES_USER: skillissues
      POSTGRES_PASSWORD: skillissues
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillissues -d skillissues"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql://skillissues:skillissues@postgres:5432/skillissues
      FRONTEND_URL: http://localhost:5173
      DEMO_MODE: ${DEMO_MODE:-true}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8000/auth/github/callback}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      ADMIN_SYNC_TOKEN: ${ADMIN_SYNC_TOKEN:-}
      RECOMMENDATION_URL: http://recommendation:8000
      CONTRIBUTION_URL: http://contribution:8000
    ports:
      - "8000:8000"
    volumes:
      - ./database:/database:ro
    depends_on:
      postgres:
        condition: service_healthy
      recommendation:
        condition: service_started
      contribution:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 2s

  ingestion:
    build: ./services/ingestion
    environment:
      DATABASE_URL: postgresql://skillissues:skillissues@postgres:5432/skillissues
      REPOSITORY_METADATA_PATH: /repo/repo_metadata.json
      MAX_REPOSITORIES: ${MAX_REPOSITORIES:-200}
      MIN_STARS: 50
      SAMPLE_SEED: ${SAMPLE_SEED:-skillissues-demo}
      RESET_CATALOG: ${RESET_CATALOG:-false}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SYNC_ISSUES: ${SYNC_ISSUES:-false}
      SYNC_REPOSITORIES: 10
      INGESTION_PORT: 8000
    volumes:
      - ./repo:/repo:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

  recommendation:
    build: ./services/recommendation
    environment:
      API_URL: http://api:8000

  contribution:
    build: ./services/contribution
    environment:
      API_URL: http://api:8000
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}

  worker:
    build: ./services/worker
    environment:
      API_URL: http://api:8000
      INGESTION_URL: http://ingestion:8000
      SYNC_INTERVAL_SECONDS: 900
    depends_on:
      api:
        condition: service_healthy
      ingestion:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
