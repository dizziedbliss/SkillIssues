name: skillissues

services:
  # --------------------------------------------------------------------------
  # PostgreSQL — authoritative persistent data store
  #
  # Tuned for the 4GB / 2 vCPU deployment target. shared_buffers is the single
  # most important setting: the issue catalog working set must stay cached.
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    # Docker's default /dev/shm is 64MB, which is below what a parallel query
    # needs to size its shared hash/sort segments: aggregates over the
    # multi-million-row repositories table fail outright with
    # "could not resize shared memory segment ... No space left on device".
    shm_size: 1gb
    environment:
      POSTGRES_DB: skillissues
      POSTGRES_USER: skillissues
      POSTGRES_PASSWORD: skillissues
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=16MB
      - -c
      # SSD pricing, as in compose.prod.yaml, so plans here match production.
      - random_page_cost=1.1
      - -c
      - max_connections=40
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillissues -d skillissues"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --------------------------------------------------------------------------
  # Redis — rate limiting and response caching only.
  #
  # Deliberately capped and non-persistent: sessions fall through to Postgres,
  # so losing this on restart costs latency, never correctness. Issue bodies
  # are kept out of Redis so they cannot evict the rate-limit counters.
  # --------------------------------------------------------------------------
  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --------------------------------------------------------------------------
  # Schema migrations — one-shot, runs to completion before the services start.
  # This is what makes a fresh `docker compose up` need no manual SQL.
  # --------------------------------------------------------------------------
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://skillissues:skillissues@postgres:5432/skillissues
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # --------------------------------------------------------------------------
  # Database roles — one-shot. Enables login for the least-privilege roles that
  # migration 00029 creates; go-api and ingestd connect as them, not as the
  # owner. Runs after every migrate so a changed password lands.
  # --------------------------------------------------------------------------
  app-roles:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      PGHOST: postgres
      PGUSER: skillissues
      PGPASSWORD: skillissues
      PGDATABASE: skillissues
      API_DB_PASSWORD: ${API_DB_PASSWORD:-skillissues_api_dev}
      INGEST_DB_PASSWORD: ${INGEST_DB_PASSWORD:-skillissues_ingest_dev}
      FLOW_DB_PASSWORD: ${FLOW_DB_PASSWORD:-skillissues_flow_dev}
    volumes:
      - ./db/app-roles.sql:/app-roles.sql:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-q", "-f", "/app-roles.sql"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # --------------------------------------------------------------------------
  # Go API — HTTP API, auth, catalog, progression
  # --------------------------------------------------------------------------
  go-api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgresql://skillissues_api:${API_DB_PASSWORD:-skillissues_api_dev}@postgres:5432/skillissues
      DB_WORK_MEM_MB: ${API_DB_WORK_MEM_MB:-32}
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_LOGIN_CLIENT_ID: ${GITHUB_LOGIN_CLIENT_ID:-}
      GITHUB_LOGIN_CLIENT_SECRET: ${GITHUB_LOGIN_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8000/auth/github/callback}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-dev_local_webhook_secret}
      ADMIN_SYNC_TOKEN: ${ADMIN_SYNC_TOKEN:-dev_local_admin_sync_token}
      # GitHub App — optional; empty GITHUB_APP_ID leaves it disabled and
      # the crawl falls back to GITHUB_TOKEN. Server-side reads only.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github-app-private-key.pem
      SYNCD_URL: http://ingestd:8002
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ${GITHUB_APP_PRIVATE_KEY_HOST_PATH:-/dev/null}:/run/secrets/github-app-private-key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app-roles:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  # --------------------------------------------------------------------------
  # Go ingestd — GitHub GraphQL ingestion engine and sync scheduler.
  #
  # Owns its own tick interval, so it needs no external trigger process.
  # --------------------------------------------------------------------------
  ingestd:
    build:
      context: .
      target: ingestd
    environment:
      DATABASE_URL: postgresql://skillissues_ingest:${INGEST_DB_PASSWORD:-skillissues_ingest_dev}@postgres:5432/skillissues
      # Publishing live flow events only; the crawl runs the same without it.
      REDIS_URL: redis://redis:6379/0
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ADMIN_SYNC_TOKEN: ${ADMIN_SYNC_TOKEN:-dev_local_admin_sync_token}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github-app-private-key.pem
      SYNCD_PORT: 8002
      PORT: 8002
    ports:
      - "8002:8002"
    volumes:
      - ${GITHUB_APP_PRIVATE_KEY_HOST_PATH:-/dev/null}:/run/secrets/github-app-private-key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      app-roles:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  # --------------------------------------------------------------------------
  # flowd — relays go-api's and ingestd's flow events to the live visualizer.
  # `curl -N localhost:8003/stream?format=ndjson` to watch it.
  # --------------------------------------------------------------------------
  flowd:
    build:
      context: .
      target: flowd
    environment:
      DATABASE_URL: postgresql://skillissues_flow:${FLOW_DB_PASSWORD:-skillissues_flow_dev}@postgres:5432/skillissues
      REDIS_URL: redis://redis:6379/0
      PROMETHEUS_URL: http://prometheus:9090
      # The visualizer's Vite dev server.
      FLOW_ALLOWED_ORIGINS: ${FLOW_ALLOWED_ORIGINS:-http://localhost:5174}
      PORT: 8003
    ports:
      - "8003:8003"
    depends_on:
      redis:
        condition: service_healthy
      app-roles:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  frontend:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      go-api:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # Monitoring — same stack as compose.prod.yaml. Grafana on
  # http://localhost:3000 (admin / $GRAFANA_ADMIN_PASSWORD, default "admin"),
  # Prometheus on http://localhost:9090.
  # --------------------------------------------------------------------------
  metrics-role:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      PGHOST: postgres
      PGUSER: skillissues
      PGPASSWORD: skillissues
      PGDATABASE: skillissues
      METRICS_DB_PASSWORD: ${METRICS_DB_PASSWORD:-metrics_ro_dev}
    volumes:
      - ./monitoring/metrics-role.sql:/metrics-role.sql:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-q", "-f", "/metrics-role.sql"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/scrape.dev:/etc/prometheus/scrape.d:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:-dev_local_grafana_secret_key}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Grafana 13 no longer bundles its datasources; it downloads them in the
      # background at startup, so panels fail until they land. Install the three
      # the dashboards use, pinned and synchronously, before the server starts.
      GF_PLUGINS_PREINSTALL_SYNC: prometheus@13.2.3,grafana-postgresql-datasource@13.0.4,loki@13.2.2
      # Grafana also fetches its default plugin bundle into grafana_data, and
      # every backend plugin in it runs as its own process. Loading all 17
      # pushed Grafana past 160m and into an OOM restart loop. Only the three
      # above are used, so the rest are installed but never loaded.
      # (PREINSTALL_DISABLED would skip the bundle but also the sync install.)
      GF_PLUGINS_DISABLE_PLUGINS: elasticsearch,influxdb,jaeger,mssql,mysql,opentsdb,tempo,zipkin,grafana-pyroscope-datasource,grafana-advisor-app,grafana-exploretraces-app,grafana-lokiexplore-app,grafana-metricsdrilldown-app,grafana-pyroscope-app
      POSTGRES_DB: skillissues
      METRICS_DB_PASSWORD: ${METRICS_DB_PASSWORD:-metrics_ro_dev}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      metrics-role:
        condition: service_completed_successfully

  # Logs that outlive their containers, as in compose.prod.yaml.
  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    command:
      - -config.file=/etc/loki/loki.yml
      - -config.expand-env=true
    environment:
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD:-72h}
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      EVENTS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api

  alloy:
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    networks:
      - default
      - docker-api
    depends_on:
      - loki
      - docker-socket-proxy

  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    command:
      - --path.rootfs=/host
    # No rslave propagation here (prod has it): WSL2 and Docker Desktop do not
    # mount / as shared, and the daemon refuses the mount outright.
    volumes:
      - /:/host:ro

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
      - --disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl,memory_numa,advtcp,process
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    devices:
      - /dev/kmsg

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    environment:
      DATA_SOURCE_URI: postgres:5432/skillissues?sslmode=disable
      DATA_SOURCE_USER: metrics_ro
      DATA_SOURCE_PASS: ${METRICS_DB_PASSWORD:-metrics_ro_dev}
    depends_on:
      metrics-role:
        condition: service_completed_successfully

  redis-exporter:
    image: oliver006/redis_exporter:v1.94.0@sha256:0842ef7110e62b40bbde2d5c11f38c6fbd99f7100c75e3866637c1b335a1eff7
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:

# Docker's API, only for docker-socket-proxy and Alloy (as in compose.prod.yaml).
networks:
  docker-api:
    internal: true
