name: skillissues

services:
  # --------------------------------------------------------------------------
  # PostgreSQL — authoritative persistent data store
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skillissues
      POSTGRES_USER: skillissues
      POSTGRES_PASSWORD: skillissues
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillissues -d skillissues"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --------------------------------------------------------------------------
  # Redis — session cache, rate limiting, distributed locks, hot-path cache
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no  # in-memory only for dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --------------------------------------------------------------------------
  # Go API — authoritative primary backend (Phase 7: Full Cutover)
  # Pure Go implementation of all 28 API routes, auth, progression, and issues.
  # --------------------------------------------------------------------------
  go-api:
    build:
      context: ./go
      dockerfile: cmd/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://skillissues:skillissues@postgres:5432/skillissues
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:5173
      DEMO_MODE: ${DEMO_MODE:-true}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8000/auth/github/callback}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-dev_local_webhook_secret}
      ADMIN_SYNC_TOKEN: ${ADMIN_SYNC_TOKEN:-dev_local_admin_sync_token}
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  # --------------------------------------------------------------------------
  # Go syncd — Sync Coordinator & GitHub GraphQL ingestion engine (Phase 4)
  # --------------------------------------------------------------------------
  syncd:
    build:
      context: ./go
      dockerfile: cmd/syncd/Dockerfile
    environment:
      DATABASE_URL: postgresql://skillissues:skillissues@postgres:5432/skillissues
      REDIS_URL: redis://redis:6379/0
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      DEMO_MODE: ${DEMO_MODE:-true}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-dev_local_webhook_secret}
      ADMIN_SYNC_TOKEN: ${ADMIN_SYNC_TOKEN:-dev_local_admin_sync_token}
      SYNCD_PORT: 8002
      PORT: 8002
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  # --------------------------------------------------------------------------
  # Go worker — priority issue catalog refresh daemon (Phase 4)
  # --------------------------------------------------------------------------
  worker:
    build:
      context: ./go
      dockerfile: cmd/worker/Dockerfile
    environment:
      API_URL: http://go-api:8000
      SYNCD_URL: http://syncd:8002
      SYNC_INTERVAL_SECONDS: 900
    depends_on:
      go-api:
        condition: service_healthy
      syncd:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      go-api:
        condition: service_healthy

volumes:
  postgres_data:
