name: skillissues

services:
  # --------------------------------------------------------------------------
  # PostgreSQL — authoritative persistent data store
  #
  # Tuned for the 4GB / 2 vCPU deployment target. shared_buffers is the single
  # most important setting: the issue catalog working set must stay cached.
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    # Docker's default /dev/shm is 64MB, which is below what a parallel query
    # needs to size its shared hash/sort segments: aggregates over the
    # multi-million-row repositories table fail outright with
    # "could not resize shared memory segment ... No space left on device".
    shm_size: 1gb
    environment:
      POSTGRES_DB: skillissues
      POSTGRES_USER: skillissues
      POSTGRES_PASSWORD: skillissues
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=40
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillissues -d skillissues"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --------------------------------------------------------------------------
  # Redis — rate limiting and response caching only.
  #
  # Deliberately capped and non-persistent: sessions fall through to Postgres,
  # so losing this on restart costs latency, never correctness. Issue bodies
  # are kept out of Redis so they cannot evict the rate-limit counters.
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --------------------------------------------------------------------------
  # Schema migrations — one-shot, runs to completion before the services start.
  # This is what makes a fresh `docker compose up` need no manual SQL.
  # --------------------------------------------------------------------------
  migrate:
    build:
      context: ./backend
      dockerfile: cmd/migrate/Dockerfile
    environment:
      DATABASE_URL: postgresql://skillissues:skillissues@postgres:5432/skillissues
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # --------------------------------------------------------------------------
  # Go API — HTTP API, auth, catalog, progression
  # --------------------------------------------------------------------------
  go-api:
    build:
      context: ./backend
      dockerfile: cmd/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://skillissues:skillissues@postgres:5432/skillissues
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8000/auth/github/callback}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-dev_local_webhook_secret}
      ADMIN_SYNC_TOKEN: ${ADMIN_SYNC_TOKEN:-dev_local_admin_sync_token}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-dev_local_token_encryption_key}
      # GitHub App (D5) — optional; empty GITHUB_APP_ID leaves it disabled
      # and falls back to the OAuth App/PAT paths above, unchanged.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_APP_CALLBACK_URL: ${GITHUB_APP_CALLBACK_URL:-http://localhost:8000/auth/github-app/callback}
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github-app-private-key.pem
      SYNCD_URL: http://ingestd:8002
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ${GITHUB_APP_PRIVATE_KEY_HOST_PATH:-/dev/null}:/run/secrets/github-app-private-key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  # --------------------------------------------------------------------------
  # Go ingestd — GitHub GraphQL ingestion engine and sync scheduler.
  #
  # Owns its own tick interval, so it needs no external trigger process.
  # --------------------------------------------------------------------------
  ingestd:
    build:
      context: ./backend
      dockerfile: cmd/ingestd/Dockerfile
    environment:
      DATABASE_URL: postgresql://skillissues:skillissues@postgres:5432/skillissues
      REDIS_URL: redis://redis:6379/0
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-dev_local_webhook_secret}
      ADMIN_SYNC_TOKEN: ${ADMIN_SYNC_TOKEN:-dev_local_admin_sync_token}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-dev_local_token_encryption_key}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_APP_CALLBACK_URL: ${GITHUB_APP_CALLBACK_URL:-http://localhost:8000/auth/github-app/callback}
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github-app-private-key.pem
      SYNCD_PORT: 8002
      PORT: 8002
    ports:
      - "8002:8002"
    volumes:
      - ${GITHUB_APP_PRIVATE_KEY_HOST_PATH:-/dev/null}:/run/secrets/github-app-private-key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  frontend:
    build: ./web
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      go-api:
        condition: service_healthy

volumes:
  postgres_data:
