name: skillissues

services:
  # --------------------------------------------------------------------------
  # PostgreSQL — authoritative persistent data store
  #
  # Tuned for the 4GB / 2 vCPU deployment target. shared_buffers is the single
  # most important setting: the issue catalog working set must stay cached.
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    # Docker's default /dev/shm is 64MB, which is below what a parallel query
    # needs to size its shared hash/sort segments: aggregates over the
    # multi-million-row repositories table fail outright with
    # "could not resize shared memory segment ... No space left on device".
    shm_size: 1gb
    environment:
      POSTGRES_DB: skillissues
      POSTGRES_USER: skillissues
      POSTGRES_PASSWORD: skillissues
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=40
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillissues -d skillissues"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --------------------------------------------------------------------------
  # Redis — rate limiting and response caching only.
  #
  # Deliberately capped and non-persistent: sessions fall through to Postgres,
  # so losing this on restart costs latency, never correctness. Issue bodies
  # are kept out of Redis so they cannot evict the rate-limit counters.
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --------------------------------------------------------------------------
  # Schema migrations — one-shot, runs to completion before the services start.
  # This is what makes a fresh `docker compose up` need no manual SQL.
  # --------------------------------------------------------------------------
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://skillissues:skillissues@postgres:5432/skillissues
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # --------------------------------------------------------------------------
  # Go API — HTTP API, auth, catalog, progression
  # --------------------------------------------------------------------------
  go-api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgresql://skillissues:skillissues@postgres:5432/skillissues
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8000/auth/github/callback}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-dev_local_webhook_secret}
      ADMIN_SYNC_TOKEN: ${ADMIN_SYNC_TOKEN:-dev_local_admin_sync_token}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-dev_local_token_encryption_key}
      # GitHub App (D5) — optional; empty GITHUB_APP_ID leaves it disabled
      # and falls back to the OAuth App/PAT paths above, unchanged.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_APP_CALLBACK_URL: ${GITHUB_APP_CALLBACK_URL:-http://localhost:8000/auth/github-app/callback}
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github-app-private-key.pem
      SYNCD_URL: http://ingestd:8002
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ${GITHUB_APP_PRIVATE_KEY_HOST_PATH:-/dev/null}:/run/secrets/github-app-private-key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  # --------------------------------------------------------------------------
  # Go ingestd — GitHub GraphQL ingestion engine and sync scheduler.
  #
  # Owns its own tick interval, so it needs no external trigger process.
  # --------------------------------------------------------------------------
  ingestd:
    build:
      context: .
      target: ingestd
    environment:
      DATABASE_URL: postgresql://skillissues:skillissues@postgres:5432/skillissues
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ADMIN_SYNC_TOKEN: ${ADMIN_SYNC_TOKEN:-dev_local_admin_sync_token}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github-app-private-key.pem
      SYNCD_PORT: 8002
      PORT: 8002
    ports:
      - "8002:8002"
    volumes:
      - ${GITHUB_APP_PRIVATE_KEY_HOST_PATH:-/dev/null}:/run/secrets/github-app-private-key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  frontend:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      go-api:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # Monitoring — same stack as compose.prod.yaml. Grafana on
  # http://localhost:3000 (admin / $GRAFANA_ADMIN_PASSWORD, default "admin"),
  # Prometheus on http://localhost:9090.
  # --------------------------------------------------------------------------
  metrics-role:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGUSER: skillissues
      PGPASSWORD: skillissues
      PGDATABASE: skillissues
      METRICS_DB_PASSWORD: ${METRICS_DB_PASSWORD:-metrics_ro_dev}
    volumes:
      - ./monitoring/metrics-role.sql:/metrics-role.sql:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-q", "-f", "/metrics-role.sql"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/scrape.dev:/etc/prometheus/scrape.d:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Grafana 13 no longer bundles the Prometheus datasource; it downloads it
      # in the background at startup, so panels fail until it lands. Install it
      # pinned and synchronously, before the server starts. (Grafana still
      # background-fetches its default plugin list once into grafana_data;
      # PREINSTALL_DISABLED would stop that but also disables this sync install.)
      GF_PLUGINS_PREINSTALL_SYNC: prometheus@13.2.3
      POSTGRES_DB: skillissues
      METRICS_DB_PASSWORD: ${METRICS_DB_PASSWORD:-metrics_ro_dev}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      metrics-role:
        condition: service_completed_successfully

  node-exporter:
    image: prom/node-exporter:v1.12.1
    command:
      - --path.rootfs=/host
    # No rslave propagation here (prod has it): WSL2 and Docker Desktop do not
    # mount / as shared, and the daemon refuses the mount outright.
    volumes:
      - /:/host:ro

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.57.0
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
      - --disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl,memory_numa,advtcp,process
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    devices:
      - /dev/kmsg

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: postgres:5432/skillissues?sslmode=disable
      DATA_SOURCE_USER: metrics_ro
      DATA_SOURCE_PASS: ${METRICS_DB_PASSWORD:-metrics_ro_dev}
    depends_on:
      metrics-role:
        condition: service_completed_successfully

  redis-exporter:
    image: oliver006/redis_exporter:v1.92.1
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
