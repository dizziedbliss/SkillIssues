# Loki, single binary: every container's logs (shipped by Alloy,
# monitoring/alloy/config.alloy) kept on the loki_data volume, so they outlive
# the containers a deploy recreates. Read them in Grafana (Explore, or the
# "SkillIssues · Logs" dashboard). Loaded with -config.expand-env=true.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # How long logs are kept; the compactor deletes older ones. LOKI_RETENTION_PERIOD
  # in the compose file's environment (a Go duration in hours, e.g. 336h).
  retention_period: ${LOKI_RETENTION_PERIOD:-336h}
  reject_old_samples: true
  reject_old_samples_max_age: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
